name: Installer checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax, ShellCheck and regression tests
        run: make check
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:13', 'almalinux:8', 'almalinux:9', 'archlinux:base']
    steps:
      - uses: actions/checkout@v4
      - name: Install and exercise real panel dependencies in a disposable container
        run: bash tests/run-integration.sh '${{ matrix.image }}'
